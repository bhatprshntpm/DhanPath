name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # Optional: set these in GitHub → Settings → Secrets → Actions
          # to enable the live Zerodha Kite sync feature.
          # Leave unset to hide the feature entirely (safe default).
          VITE_KITE_API_KEY:    ${{ secrets.VITE_KITE_API_KEY }}
          VITE_KITE_WORKER_URL: ${{ secrets.VITE_KITE_WORKER_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
